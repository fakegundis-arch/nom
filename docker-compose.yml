services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container listen on all interfaces; the port below is only
      # published on the VPS's localhost, for Caddy to reach.
      WEBHOOK_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
